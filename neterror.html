    line-height: 22px;

    font-size: 12px;

  }

  function typeText(code) {
    var raw = String(code).trim();
    if (!raw) { return ""; }
    if (/^ERR_/i.test(raw)) { return raw.toUpperCase(); }
    if (/^0x[0-9a-f]+$/i.test(raw)) { return IE_ERROR[raw.toLowerCase()] || ""; }

    if (isNaN(n)) { return ""; }

    if (!domain) { return ""; }
    var scheme = url.indexOf("://") > 0 ? url.split("://")[0] + "://" : "";

    var parts = domain.split(".");

    if (n == 3 && parts[0] != "www") {

    } else if (/^0x8004015[45]$/i.test(codeText)) {
      setText("IE浏览器出现异常", "（IE内核调用错误）", "可能原因：您的Internet Explorer程序可能已经损坏<br/>建议如下操作：");
      show("btn-reinstall-ie");
      show("btn-expert");
    } else {
      setText("您访问的网页出错了！", "（连接错误）", "网络连接异常、网站服务器失去响应");
      show("btn-refesh");
    }

    var home = lasturl ? homeUrl(lasturl) : "";
    if (home) {
      $("btn-gohome").setAttribute("href", home);
    } else {
      $("btn-gohome").style.display = "none";
    }

    // 拿不到原始地址时无法刷新/回首页，至少保证有一个可用按钮
    if (!lasturl) {
      $("btn-refesh").style.display = "none";
    }
    var visible = 0;
    for (i = 0; i < btnIds.length; i++) {
      var b = $(btnIds[i]);
      if (b && b.style.display !== "none") { visible++; }
    }
    if (!visible) { show("btn-close"); }
  }

  function bind() {
    $("btn-refesh").addEventListener("click", function () {
      if (!lasturl) { return; }
      try { window.location.replace(lasturl); } catch (e) { window.location.href = lasturl; }
    });
    $("btn-goback").addEventListener("click", function () {
      window.history.back();
    });
    $("btn-close").addEventListener("click", function () {
      window.close();
    });
    $("btn-jijiuxiang").addEventListener("click", function () {
      if (window.chrome && typeof window.chrome.send === "function") {
        window.chrome.send("startnetfix");
        window.chrome.send("startnetfix");
      }
    });
    $("btn-reinstall-ie").addEventListener("click", function () {
      var sys = String(window.sysinfo_ || "");
      var appid = {
        winxp32: "77", winvista32: "105043", winvista64: "105045",
        win732: "102630048", win764: "102630050"
      }[sys];
      this.setAttribute("href", appid
        ? "http://baoku.360.cn/soft/show/appid/" + appid
        : "http://baoku.360.cn/soft/search?kw=Internet%20Explorer");
    });
  }

  try {
    bind();
    render();
  } catch (e) {
    var t = document.getElementById("tips-title");
    if (t) { t.textContent = "加载出错"; }
  }
})();
</script>
</body>
</html>
